  - name: "transfer_demo_cash"
    title: "同客户资金账户演示划转"
    description: "同客户、同币种、最新账期内原子划转；两账户均须本人管理或由业务管理员执行。四条写入同时成功或同时回滚。"
    confirm: true
    parameters:
      source_fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      target_fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      amount_cents: {"type": "integer", "description": "金额单位为分，例如 10000 为100元；仅演示记账，无外部支付", "min": 1, "max": 100000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount, balance, changeCash } from "account";

      function run(args, ctx) {
        const u=operator(ctx);
        if(args.source_fund_account_no===args.target_fund_account_no) deny('转出和转入账户不能相同');
        const source=ownedAccount(args.source_fund_account_no,u,ctx,true), target=ownedAccount(args.target_fund_account_no,u,ctx,true);
        if(source.customer_no!==target.customer_no || source.currency!==target.currency) deny('只允许同客户同币种账户之间划转');
        const sb=balance(source), tb=balance(target);
        if(sb.trade_date!==tb.trade_date) deny('两个账户必须使用同一最新账期');
        const debit=changeCash(source,sb,args.amount_cents,true);
        const credit=changeCash(target,tb,args.amount_cents,false);
        if(debit.before+credit.before!==debit.after+credit.after) deny('资金划转守恒校验失败');
        return {trade_date:sb.trade_date,amount_cents:args.amount_cents,source:debit,target:credit,reason:args.reason};
      }
  - name: "correct_latest_close_price"
    title: "更正最新收盘价并重估持仓"
    description: "仅业务管理员；仅最新行情日，原子更正行情收盘/高低价并同步重估同日该证券全部持仓，不改成交和资金。"
    confirm: true
    parameters:
      security_code: {"type": "string", "description": "证券代码，例如 688001", "pattern": "^[0-9]{6}$"}
      trade_date: {"type": "string", "description": "最新演示账期，例如 2026-10-20", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
      expected_close: {"type": "integer", "description": "更正前的收盘价，单位分；688001示例为8722", "min": 1, "max": 1000000}
      close_price: {"type": "integer", "description": "新收盘价，单位分", "min": 1, "max": 1000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator, administrator } from "employee";

      function run(args, ctx) {
        const u=operator(ctx); administrator(u);
        const last=db.one`SELECT MAX(trade_date) AS day FROM daily_quotes`;
        if(args.trade_date!==last.day) deny('仅允许更正最新行情日，不回写历史价格');
        const q=my.one`SELECT id,close FROM daily_quotes WHERE security_code=${args.security_code} AND trade_date=${args.trade_date}`;
        if(!q || q.close!==args.expected_close) deny('行情不存在或原收盘价已变化');
        if(args.close_price===q.close) deny('新收盘价与当前值相同');
        const count=db.one`SELECT COUNT(*) AS n FROM positions WHERE security_code=${args.security_code} AND trade_date=${args.trade_date}`;
        const future=db.one`SELECT COUNT(*) AS n FROM positions WHERE security_code=${args.security_code} AND trade_date>${args.trade_date}`;
        if(future.n!==0) deny('已有后续持仓，不能更正历史收盘价');
        const n=db.exec`UPDATE daily_quotes SET close=${args.close_price}, high=MAX(high,${args.close_price}), low=MIN(low,${args.close_price}) WHERE id=${q.id} AND close=${args.expected_close}`;
        if(n!==1) deny('行情已变化');
        const revalued=db.exec`UPDATE positions SET close_price=${args.close_price}, market_value_cents=quantity*${args.close_price} WHERE security_code=${args.security_code} AND trade_date=${args.trade_date}`;
        if(revalued!==count.n) deny('持仓集合已变化');
        const bad=db.one`SELECT COUNT(*) AS n FROM positions WHERE security_code=${args.security_code} AND trade_date=${args.trade_date} AND (close_price<>${args.close_price} OR market_value_cents<>quantity*close_price)`;
        const after=my.one`SELECT close,high,low FROM daily_quotes WHERE id=${q.id}`;
        if(bad.n!==0 || !after || after.close!==args.close_price || after.high<after.close || after.low>after.close) deny('行情或持仓重估后置校验失败');
        return {security_code:args.security_code,trade_date:args.trade_date,before:q.close,after:after.close,revalued_positions:revalued,reason:args.reason};
      }
actionLibraries:
  - name: employee
    title: 员工身份检查
    description: 在职员工与证券业务管理员检查
    script: |
      export function operator(ctx) {
        const u = db.one`SELECT e.employee_id, e.status, r.code AS role_code FROM employees e JOIN roles r ON r.id=e.role_id WHERE e.employee_id=${ctx.userId}`;
        if (!u || u.status !== 'active') deny('仅在职员工可执行演示操作');
        return u;
      }

      export function administrator(u) {
        if (u.role_code !== 'ADMIN') deny('此操作仅证券业务管理员可执行');
      }
  - name: account
    title: 账户归属检查
    description: 资金账户归属、可见性与状态检查
    script: |
      export function ownedAccount(no, u, ctx, active) {
        const a = my.one`SELECT fund_account_no, customer_no, manager_id, currency, status FROM fund_accounts WHERE fund_account_no=${no}`;
        if (!a) deny('资金账户不存在或无权查看');
        if (a.manager_id !== ctx.userId && u.role_code !== 'ADMIN') deny('只能操作本人管理的资金账户；可查询不代表可修改');
        if (active && a.status !== 'active') deny('资金账户必须处于 active 状态');
        return a;
      }

      export function balance(a) {
        const last=db.one`SELECT MAX(trade_date) AS day FROM daily_balances`;
        const b=my.one`SELECT id,trade_date,opening_balance,transfer_in,transfer_out,buy_amount,sell_amount,fees,closing_balance,available_balance,withdrawable_balance FROM daily_balances WHERE fund_account_no=${a.fund_account_no} AND trade_date=${last.day}`;
        if(!b) deny('账户缺少最新日结，不能补写历史账期');
        if(!Number.isSafeInteger(b.closing_balance) || b.available_balance!==b.closing_balance || b.withdrawable_balance!==Math.max(0,b.closing_balance-b.sell_amount)) deny('日结精度或可用可取口径不符合演示模型');
        const flow=db.one`SELECT trade_date,balance_after FROM cash_flows WHERE fund_account_no=${a.fund_account_no} ORDER BY id DESC LIMIT 1`;
        if(flow && (flow.balance_after!==b.closing_balance || flow.trade_date>b.trade_date)) deny('流水尾余额与日结不一致');
        return b;
      }

      export function changeCash(a,b,amount,debit) {
        let n;
        if(debit) {
          n=db.exec`UPDATE daily_balances SET transfer_out=transfer_out+${amount}, closing_balance=closing_balance-${amount}, available_balance=available_balance-${amount}, withdrawable_balance=MAX(0,closing_balance-${amount}-sell_amount) WHERE id=${b.id} AND closing_balance=${b.closing_balance} AND available_balance>=${amount} AND withdrawable_balance>=${amount}`;
        } else {
          n=db.exec`UPDATE daily_balances SET transfer_in=transfer_in+${amount}, closing_balance=closing_balance+${amount}, available_balance=available_balance+${amount}, withdrawable_balance=MAX(0,closing_balance+${amount}-sell_amount) WHERE id=${b.id} AND closing_balance=${b.closing_balance} AND closing_balance<=9007199254740991-${amount}`;
        }
        if(n!==1) deny('可取资金不足、余额已变化或超出安全整数范围');
        const after=db.one`SELECT closing_balance,available_balance,withdrawable_balance FROM daily_balances WHERE id=${b.id}`;
        const delta=debit?-amount:amount, type=debit?'WITHDRAWAL':'DEPOSIT';
        if(after.closing_balance!==b.closing_balance+delta) deny('日结金额后置校验失败');
        const inserted=db.exec`INSERT INTO cash_flows(customer_no,fund_account_no,trade_date,flow_type,trade_id,amount_cents,fee_cents,balance_after) VALUES(${a.customer_no},${a.fund_account_no},${b.trade_date},${type},NULL,${delta},0,${after.closing_balance})`;
        if(inserted!==1) deny('资金流水写入失败');
        const check=db.one`SELECT SUM(CASE WHEN flow_type='DEPOSIT' THEN amount_cents ELSE 0 END) AS tin, SUM(CASE WHEN flow_type='WITHDRAWAL' THEN -amount_cents ELSE 0 END) AS tout FROM cash_flows WHERE fund_account_no=${a.fund_account_no} AND trade_date=${b.trade_date}`;
        const final=db.one`SELECT transfer_in,transfer_out,closing_balance FROM daily_balances WHERE id=${b.id}`;
        if(check.tin!==final.transfer_in || check.tout!==final.transfer_out) deny('资金流水与日结转入转出对账失败');
        return {fund_account_no:a.fund_account_no,before:b.closing_balance,after:after.closing_balance,available_balance:after.available_balance,withdrawable_balance:after.withdrawable_balance};
      }
  - name: customer
    title: 客户归属检查
    description: 客户可见性、状态和全部账户归属检查
    script: |
      export function ownedCustomer(no, u, ctx) {
        const c = my.one`SELECT customer_no, mobile, risk_level, investor_type, status FROM customers WHERE customer_no=${no}`;
        if (!c || c.status !== 'active') deny('客户不存在、非正常状态或无权查看');
        const ownership = db.one`SELECT COUNT(*) AS total, SUM(CASE WHEN manager_id<>${ctx.userId} THEN 1 ELSE 0 END) AS other_accounts_n FROM fund_accounts WHERE customer_no=${no}`;
        if (!ownership || ownership.total===0 || (u.role_code!=='ADMIN' && ownership.other_accounts_n>0)) deny('客户资料由多个经理共享，须全部账户归本人管理或由业务管理员修改');
        return c;
      }
