  - name: "cancel_order_remainder"
    title: "撤销未成交委托余量"
    description: "仅 PARTIAL 委托可转为 PART_CANCELLED，保留已有成交、费用和持仓；样例库未建冻结资金/证券模型，不生成退款。"
    confirm: true
    parameters:
      order_no: {"type": "string", "description": "委托编号，例如 O0000002309", "pattern": "^O[0-9]{10}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), o=my.one`SELECT id,order_no,fund_account_no,status,quantity,filled_quantity FROM orders WHERE order_no=${args.order_no}`;
        if(!o) deny('委托不存在或无权查看');
        ownedAccount(o.fund_account_no,u,ctx,true);
        if(o.status!=='PARTIAL' || o.filled_quantity<=0 || o.filled_quantity>=o.quantity) deny('只有部分成交且仍有余量的委托可撤余单');
        const trades=db.one`SELECT COALESCE(SUM(quantity),0) AS n FROM trades WHERE order_id=${o.id}`;
        if(trades.n!==o.filled_quantity) deny('委托与成交数量不一致，不能撤单');
        const n=db.exec`UPDATE orders SET status='PART_CANCELLED' WHERE id=${o.id} AND status='PARTIAL' AND quantity=${o.quantity} AND filled_quantity=${o.filled_quantity}`;
        if(n!==1) deny('委托状态已变化');
        const after=my.one`SELECT status,filled_quantity FROM orders WHERE id=${o.id}`;
        if(!after || after.status!=='PART_CANCELLED' || after.filled_quantity!==o.filled_quantity) deny('撤单后置校验失败');
        return {order_no:o.order_no,before:o.status,after:after.status,cancelled_quantity:o.quantity-o.filled_quantity,filled_quantity:o.filled_quantity,reason:args.reason};
      }
  - name: "update_order_channel"
    title: "更正委托来源渠道"
    description: "仅修改 APP/PC/COUNTER 来源元数据；不得修改成交、价格、数量和金额。"
    confirm: true
    parameters:
      order_no: {"type": "string", "description": "委托编号，例如 O0000002309", "pattern": "^O[0-9]{10}$"}
      channel: {"type": "string", "description": "来源渠道", "enum": ["APP", "PC", "COUNTER"]}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), o=my.one`SELECT id,order_no,fund_account_no,channel FROM orders WHERE order_no=${args.order_no}`;
        if(!o) deny('委托不存在或不可见');
        ownedAccount(o.fund_account_no,u,ctx,false);
        if(o.channel===args.channel) deny('新渠道与当前值相同');
        const n=db.exec`UPDATE orders SET channel=${args.channel} WHERE id=${o.id} AND channel=${o.channel}`;
        if(n!==1) deny('委托元数据已变化');
        const after=my.one`SELECT channel FROM orders WHERE id=${o.id}`;
        if(!after || after.channel!==args.channel) deny('渠道后置校验失败');
        return {order_no:o.order_no,before:o.channel,after:after.channel,reason:args.reason};
      }
  - name: "close_unused_stock_account"
    title: "删除无委托的证券账户"
    description: "仅本人账户或业务管理员操作；保留所有被历史委托引用的账户。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      exchange: {"type": "string", "description": "证券交易所", "enum": ["SH", "SZ"]}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,true);
         const old=my.one`SELECT id,stock_account_no FROM stock_accounts WHERE fund_account_no=${a.fund_account_no} AND exchange=${args.exchange}`;

         if(!old) deny('证券账户不存在或不可见');
         const used=db.one`SELECT COUNT(*) AS n FROM orders WHERE stock_account_id=${old.id}`;
         if(used.n!==0) deny('证券账户已有历史委托，不可删除');
         const n=db.exec`DELETE FROM stock_accounts WHERE id=${old.id} AND fund_account_no=${a.fund_account_no} AND stock_account_no=${old.stock_account_no} AND NOT EXISTS(SELECT 1 FROM orders WHERE stock_account_id=${old.id})`;
         if(n!==1) deny('证券账户已变化或已被委托引用');
         if(db.one`SELECT id FROM stock_accounts WHERE id=${old.id}`) deny('证券账户删除后置校验失败');
         return {fund_account_no:a.fund_account_no,exchange:args.exchange,stock_account_no:old.stock_account_no,deleted:true,reason:args.reason};
      }
  - name: "open_stock_account"
    title: "新增证券账户"
    description: "仅本人账户或业务管理员操作；保留所有被历史委托引用的账户。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      exchange: {"type": "string", "description": "证券交易所", "enum": ["SH", "SZ"]}
      stock_account_no: {"type": "string", "description": "沪 A+9位数字；深10位数字，例如 9000000164", "maxLength": 10}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,true);
         const old=my.one`SELECT id,stock_account_no FROM stock_accounts WHERE fund_account_no=${a.fund_account_no} AND exchange=${args.exchange}`;

         if(old) deny('该资金账户已存在此交易所的证券账户，请先删除无委托账户');
         if(args.exchange==='SH' ? !/^A[0-9]{9}$/.test(args.stock_account_no) : !/^[0-9]{10}$/.test(args.stock_account_no)) deny('证券账号格式与交易所不符');
         if(db.one`SELECT id FROM stock_accounts WHERE stock_account_no=${args.stock_account_no}`) deny('证券账号已被使用');
         const n=db.exec`INSERT INTO stock_accounts(fund_account_no,exchange,stock_account_no) VALUES(${a.fund_account_no},${args.exchange},${args.stock_account_no})`;
         if(n!==1) deny('证券账户新增失败');
         const after=my.one`SELECT stock_account_no FROM stock_accounts WHERE fund_account_no=${a.fund_account_no} AND exchange=${args.exchange}`;
         if(!after || after.stock_account_no!==args.stock_account_no) deny('证券账户新增后置校验失败');
         return {fund_account_no:a.fund_account_no,exchange:args.exchange,stock_account_no:after.stock_account_no,created:true,reason:args.reason};
      }
  - name: "deposit_demo_cash"
    title: "演示入金记账"
    description: "在最新演示账期同步追加资金流水和更新日结，费用为0；并非真实银行转账，不能回写历史账期。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      amount_cents: {"type": "integer", "description": "金额单位为分，例如 10000 为100元；仅演示记账，无外部支付", "min": 1, "max": 100000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount, balance, changeCash } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,true);
        const b=balance(a), changed=changeCash(a,b,args.amount_cents,false);
        return {...changed,trade_date:b.trade_date,amount_cents:args.amount_cents,fee_cents:0,reason:args.reason};
      }
  - name: "withdraw_demo_cash"
    title: "演示出金记账"
    description: "在最新演示账期同步追加资金流水和更新日结，费用为0；并非真实银行转账，不能回写历史账期。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      amount_cents: {"type": "integer", "description": "金额单位为分，例如 10000 为100元；仅演示记账，无外部支付", "min": 1, "max": 100000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount, balance, changeCash } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,true);
        const b=balance(a), changed=changeCash(a,b,args.amount_cents,true);
        return {...changed,trade_date:b.trade_date,amount_cents:args.amount_cents,fee_cents:0,reason:args.reason};
