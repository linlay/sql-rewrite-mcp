  - name: "freeze_fund_account"
    title: "冻结资金账户"
    description: "仅本人管理的资金账户或业务管理员可操作；不修改资金、成交和持仓。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,false);
        if(a.status!=='active') deny('仅 active 状态可执行此操作');
        const n=db.exec`UPDATE fund_accounts SET status='frozen' WHERE fund_account_no=${a.fund_account_no} AND manager_id=${a.manager_id} AND status='active'`;
        if(n!==1) deny('账户状态或归属已变化，请重新预览');
        const after=my.one`SELECT status FROM fund_accounts WHERE fund_account_no=${a.fund_account_no}`;
        if(!after || after.status!=='frozen') deny('账户状态后置校验失败');
        return {fund_account_no:a.fund_account_no,before:'active',after:after.status,reason:args.reason};
      }
  - name: "unfreeze_fund_account"
    title: "解冻资金账户"
    description: "仅本人管理的资金账户或业务管理员可操作；不修改资金、成交和持仓。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx), a=ownedAccount(args.fund_account_no,u,ctx,false);
        if(a.status!=='frozen') deny('仅 frozen 状态可执行此操作');
        const n=db.exec`UPDATE fund_accounts SET status='active' WHERE fund_account_no=${a.fund_account_no} AND manager_id=${a.manager_id} AND status='frozen'`;
        if(n!==1) deny('账户状态或归属已变化，请重新预览');
        const after=my.one`SELECT status FROM fund_accounts WHERE fund_account_no=${a.fund_account_no}`;
        if(!after || after.status!=='active') deny('账户状态后置校验失败');
        return {fund_account_no:a.fund_account_no,before:'frozen',after:after.status,reason:args.reason};
      }
  - name: "reassign_account_manager"
    title: "调整账户客户经理"
    description: "仅业务管理员；校验原经理和目标在职客户经理，修改后立即影响行权限。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      expected_manager_id: {"type": "integer", "description": "当前客户经理编号", "min": 1}
      new_manager_id: {"type": "integer", "description": "目标在职客户经理编号，例如 2", "min": 1}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator, administrator } from "employee";
      import { ownedAccount } from "account";

      function run(args, ctx) {
        const u=operator(ctx); administrator(u);
        const a=ownedAccount(args.fund_account_no,u,ctx,false);
        if(a.manager_id!==args.expected_manager_id) deny('原客户经理已变化');
        if(args.new_manager_id===a.manager_id) deny('目标经理与当前经理相同');
        const target=db.one`SELECT e.employee_id FROM employees e JOIN roles r ON r.id=e.role_id WHERE e.employee_id=${args.new_manager_id} AND e.status='active' AND r.code='MANAGER'`;
        if(!target) deny('目标必须是在职客户经理');
        const n=db.exec`UPDATE fund_accounts SET manager_id=${args.new_manager_id} WHERE fund_account_no=${a.fund_account_no} AND manager_id=${args.expected_manager_id}`;
        if(n!==1) deny('账户归属已变化');
        const after=db.one`SELECT manager_id FROM fund_accounts WHERE fund_account_no=${a.fund_account_no}`;
        if(!after || after.manager_id!==args.new_manager_id) deny('账户归属后置校验失败');
        return {fund_account_no:a.fund_account_no,before:a.manager_id,after:after.manager_id,reason:args.reason};
      }
  - name: "update_employee_mobile"
    title: "修改员工手机号"
    description: "在职员工可修改本人联系方式；业务管理员可修改其他在职员工。"
    confirm: true
    parameters:
      employee_id: {"type": "integer", "description": "员工编号，例如 1", "min": 1}
      mobile: {"type": "string", "description": "合成演示手机号码，例如 13900001359", "pattern": "^1[3-9][0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator } from "employee";

      function run(args, ctx) {
        const u=operator(ctx);
        if(args.employee_id!==ctx.userId && u.role_code!=='ADMIN') deny('只能修改本人联系方式');
        const before=my.one`SELECT employee_id,mobile,status FROM employees WHERE employee_id=${args.employee_id}`;
        if(!before || before.status!=='active') deny('目标员工不存在、已离职或不可见');
        if(before.mobile===args.mobile) deny('新手机号与当前值相同');
        const n=db.exec`UPDATE employees SET mobile=${args.mobile} WHERE employee_id=${args.employee_id} AND mobile=${before.mobile} AND status='active'`;
        if(n!==1) deny('员工资料已变化');
        const after=my.one`SELECT mobile FROM employees WHERE employee_id=${args.employee_id}`;
        if(!after || after.mobile!==args.mobile) deny('员工联系方式后置校验失败');
        return {employee_id:args.employee_id,before:before.mobile,after:after.mobile,reason:args.reason};
      }
  - name: "update_branch_address"
    title: "维护分公司地址"
    description: "仅业务管理员可维护公共目录；不修改主键、关联关系、证券数量或价格。"
    confirm: true
    parameters:
      code: {"type": "string", "description": "分公司编号，例如 B001", "pattern": "^B[0-9]{3}$"}
      address: {"type": "string", "description": "新展示名称或合成演示地址", "maxLength": 120, "pattern": "\\S"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      import { operator, administrator } from "employee";

      function run(args, ctx) {
        const u=operator(ctx); administrator(u);
        const before=my.one`SELECT code,address FROM branches WHERE code=${args.code}`;
        if(!before) deny('目录记录不存在或不可见');
        if(before.address===args.address) deny('新值与当前值相同');
        const n=db.exec`UPDATE branches SET address=${args.address} WHERE code=${args.code} AND address=${before.address}`;
        if(n!==1) deny('目录记录已变化');
        const after=my.one`SELECT address FROM branches WHERE code=${args.code}`;
        if(!after || after.address!==args.address) deny('目录更新后置校验失败');
        return {code:args.code,before:before.address,after:after.address,reason:args.reason};
