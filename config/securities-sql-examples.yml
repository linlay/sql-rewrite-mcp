# 证券演示库示例；将 sqlExamples 配置到对应数据库，其他数据库可省略。
sqlExamples:
  - label: "各营业部客户数"
    sql: "SELECT department_code, COUNT(DISTINCT customer_no) AS customers FROM fund_accounts GROUP BY department_code ORDER BY department_code"
  - label: "客户资金日结"
    sql: "SELECT c.customer_no,c.name,b.fund_account_no,b.trade_date,b.closing_balance,b.withdrawable_balance FROM customers c JOIN daily_balances b ON b.customer_no=c.customer_no WHERE b.trade_date='2026-10-20' ORDER BY b.closing_balance DESC"
  - label: "证券成交明细"
    sql: "SELECT t.trade_date,c.name,s.code,s.name AS security,t.side,t.quantity,t.price,t.amount_cents,t.fee_cents FROM trades t JOIN customers c ON c.customer_no=t.customer_no JOIN securities s ON s.code=t.security_code ORDER BY t.id DESC LIMIT 100"
  - label: "日终持仓"
    sql: "SELECT c.name,p.fund_account_no,s.code,p.quantity,p.available_quantity,p.market_value_cents FROM positions p JOIN customers c ON c.customer_no=p.customer_no JOIN securities s ON s.code=p.security_code WHERE p.trade_date='2026-10-20' ORDER BY p.market_value_cents DESC"
  - label: "成交总额"
    sql: "SELECT SUM(amount_cents) AS total_cents FROM trades"
  - label: "CTE 聚合"
    sql: "WITH v AS (SELECT customer_no,SUM(amount_cents) AS total FROM trades GROUP BY customer_no) SELECT c.name,v.total FROM v JOIN customers c ON c.customer_no=v.customer_no ORDER BY total DESC"
  - label: "可见员工"
    sql: "SELECT emp_no,name,title,status FROM employees ORDER BY employee_id"
  - label: "管理范围（仅管理员）"
    sql: "SELECT * FROM employee_scopes ORDER BY employee_id"
  - label: "试图绕过：OR 1=1"
    sql: "SELECT fund_account_no,customer_no,department_code FROM fund_accounts WHERE department_code='D030' OR 1=1 ORDER BY fund_account_no"
