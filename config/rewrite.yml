    sql: SELECT t.* FROM main.daily_balances AS t WHERE t.fund_account_no IN (SELECT f.fund_account_no FROM main.fund_accounts AS f WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR f.manager_id=${userId} OR f.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10)))))
  - table: employees
    scheme: EMPLOYEE
    reason: 本人及管理范围内员工（分公司范围包括分公司负责人）
    sql: >-
      SELECT t.* FROM main.employees AS t WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND
      (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR t.employee_id=${userId} OR t.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10)))
      OR EXISTS (SELECT 1 FROM main.employee_scopes AS s WHERE s.employee_id=${userId}
      AND s.branch_code=t.branch_code AND s.effective_date<=substr(${asOf},1,10)
      AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10))))
  - table: employee_scopes
    scheme: RESTRICTED
    reason: 仅管理员可查询管理范围配置
    deny_unless: "EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN')"
    deny_message: 仅在职管理员可查询
    sql: SELECT t.* FROM main.employee_scopes AS t WHERE EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN')
