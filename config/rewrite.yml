version: 1
schemes:
  - {scheme: NONE, name: 公共字典, description: 公开的机构和证券基础资料}
  - {scheme: CUSTOMER, name: 客户权限, description: 按资金账户归属控制业务数据及对应客户资料}
  - {scheme: EMPLOYEE, name: 员工权限, description: 本人及有效管理范围内员工}
  - {scheme: RESTRICTED, name: 管理范围, description: 仅管理员可查询权限配置}
tables:
  - {table: roles, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: branches, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: departments, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: securities, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: trading_calendar, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: daily_quotes, scheme: NONE, reason: 公共字典, passthrough: true}
  - {table: schema_comments, scheme: NONE, reason: 公共字典, passthrough: true}
  - table: customers
    scheme: CUSTOMER
    reason: 按资金账户开户营业部和客户经理计算权限
    sql: SELECT t.* FROM main.customers AS t WHERE t.customer_no IN (SELECT DISTINCT f.customer_no FROM main.fund_accounts AS f WHERE f.fund_account_no IN (SELECT f.fund_account_no FROM main.fund_accounts AS f WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR f.manager_id=${userId} OR f.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10))))))
  - table: fund_accounts
    scheme: CUSTOMER
    reason: 按资金账户开户营业部和客户经理计算权限
    sql: SELECT t.* FROM main.fund_accounts AS t WHERE t.fund_account_no IN (SELECT f.fund_account_no FROM main.fund_accounts AS f WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR f.manager_id=${userId} OR f.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10)))))
  - table: stock_accounts
    scheme: CUSTOMER
    reason: 按资金账户开户营业部和客户经理计算权限
    sql: SELECT t.* FROM main.stock_accounts AS t WHERE t.fund_account_no IN (SELECT f.fund_account_no FROM main.fund_accounts AS f WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR f.manager_id=${userId} OR f.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10)))))
