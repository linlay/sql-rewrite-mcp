    sql: SELECT t.* FROM main.orders AS t WHERE t.fund_account_no IN (SELECT f.fund_account_no FROM main.fund_accounts AS f WHERE EXISTS (SELECT 1 FROM main.employees AS a WHERE a.employee_id=${userId} AND a.status='active') AND (EXISTS (SELECT 1 FROM main.employees AS a JOIN main.roles AS r ON r.id=a.role_id WHERE a.employee_id=${userId} AND a.status='active' AND r.code='ADMIN') OR f.manager_id=${userId} OR f.department_code IN (SELECT d.code FROM main.departments AS d JOIN main.employee_scopes AS s ON s.department_code=d.code OR s.branch_code=d.branch_code WHERE s.employee_id=${userId} AND s.effective_date<=substr(${asOf},1,10) AND (s.expiry_date IS NULL OR s.expiry_date>substr(${asOf},1,10)))))
